[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nightvision"
version = "0.1.0"
description = "Amélioration de scènes nocturnes par diffusion conditionnelle guidée par Retinex (DDPM / DDIM)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "NightVision Gen Team" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.23.0",
    "scipy>=1.9.0",
    "pillow>=9.3.0",
    "opencv-python-headless>=4.7.0",
    "pyyaml>=6.0",
    "tqdm>=4.64.0",
    "matplotlib>=3.6.0",
    "scikit-image>=0.19.0",
    "lpips>=0.1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]
app = [
    "streamlit>=1.25.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
ignore = ["BLE001"]

[tool.black]
line-length = 100
target-version = ['py310']
